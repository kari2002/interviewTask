version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: messages_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - db
    ports:
      - "5000:5000"
    command: >
      sh -c "
      npx sequelize-cli db:migrate --config src/config/config.js &&
      npx sequelize-cli db:seed:all --config src/config/config.js &&
      npm run dev
      "

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"